name: Graph region (own routing, OH+KY+IN)

# Vetta's own scored road network for all of Ohio, Kentucky and Indiana (docs/OWN_ROUTING.md), hosted for free: the
# tiles are committed to this repository's `graph-data` branch (v1/<i>_<j>.vgr + v1/index.json; never main, never the
# app bundle) and the Worker relays them at /api/graph/v1/ (backend/src/graph.ts) from raw.githubusercontent.com.
# No R2, no KV, no secrets. Each rebuild is a new commit on graph-data (normal push, never forced).
#
# The region is cut into bands of latitude (one job each, in parallel) and each band into 1 degree blocks, each built
# from its own extract with 0.4 degree round it (tools/graph_etl/region_blocks.py) so blocks agree on the tiles they
# share an edge with. All bands share one build id (the extract's week + the model hash).
#
# Triggers: a manual run (once this file is on main), a call from graph.yml's "region" input, or a push to
# claude/own-routing-region that changes tools/graph_etl/REGION_BUILD (the way to run it before it is on main).
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [claude/own-routing-region]
    paths:
      - "tools/graph_etl/REGION_BUILD"

permissions:
  contents: write

concurrency:
  group: graph-region
  cancel-in-progress: false

env:
  STATES: "ohio kentucky indiana"
  REGION: "-89.75,36.5,-80.5,42.5"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      week: ${{ steps.week.outputs.w }}
    steps:
      - name: Week (cache key)
        id: week
        run: echo "w=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the download cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .graph_cache/osm
          key: graph-osm-${{ steps.week.outputs.w }}
      - name: Download the Geofabrik extracts
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .graph_cache/osm
          for s in $STATES; do
            curl -fSL --retry 5 --retry-delay 10 -o ".graph_cache/osm/$s.osm.pbf" "https://download.geofabrik.de/north-america/us/$s-latest.osm.pbf"
          done
          ls -la .graph_cache/osm
      - name: Save the download cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .graph_cache/osm
          key: graph-osm-${{ steps.week.outputs.w }}

  band:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        band: ["36.5", "37.5", "38.5", "39.5", "40.5", "41.5"]
    env:
      WORK: /home/runner/graph_work
    steps:
      - uses: actions/checkout@v4
      - name: Free disk, add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -m && df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install -r tools/graph_etl/requirements.txt
      - name: Restore the extracts
        uses: actions/cache/restore@v4
        with:
          path: .graph_cache/osm
          key: graph-osm-${{ needs.download.outputs.week }}
          fail-on-cache-miss: true
      - name: The region's context grid (graph-data ctx/v1), else Cincinnati's
        run: |
          if git fetch -q --depth 1 origin graph-data && git cat-file -e FETCH_HEAD:ctx/v1/index.json 2>/dev/null; then
            mkdir -p "$WORK/ctx_dl" && git archive FETCH_HEAD ctx | tar -x -C "$WORK/ctx_dl"
            echo "CTX_DIR=$WORK/ctx_dl/ctx/v1" >> "$GITHUB_ENV"
          else
            # no region grid yet: run ctx-region.yml first. Scored with Cincinnati's bundles only, every edge outside it
            # has the grid's channels unknown (the build id then has no -g suffix)
            echo "::warning::no context grid on graph-data (ctx/v1): edges outside Cincinnati are scored without it"
            echo "CTX_DIR=${{ github.workspace }}/web/data/ctx/v1" >> "$GITHUB_ENV"
          fi
      - name: Merge and cut the band's blocks
        run: |
          mkdir -p "$WORK/blocks"
          osmium merge --overwrite -o "$WORK/region.osm.pbf" .graph_cache/osm/*.osm.pbf
          python -m tools.graph_etl.region_blocks --region="$REGION" --band "${{ matrix.band }}" --dir "$WORK/blocks" > "$WORK/blocks.txt"
          cat "$WORK/blocks.txt"
      - name: Build the blocks
        run: |
          while read -r name box clip; do
            echo "::group::$name $box"
            # one block at a time (all of a band in one osmium pass ran the runner out of memory)
            osmium extract --overwrite -s smart -b "$clip" -o "$WORK/blocks/$name.osm.pbf" "$WORK/region.osm.pbf"
            free -m | head -2
            python -m tools.graph_etl.build --pbf "$WORK/blocks/$name.osm.pbf" --tiles="$box" --out "out/$name/v1" \
              --work "$WORK/w_$name" --dem-cache "$WORK/dem" --source "Geofabrik ohio, kentucky, indiana (merged)" \
              --build "${{ needs.download.outputs.week }}" --ctx "$CTX_DIR"
            rm -rf "$WORK/w_$name" "$WORK/blocks/$name.osm.pbf"
            echo "::endgroup::"
          done < "$WORK/blocks.txt"
          rm -f "$WORK/region.osm.pbf"
          du -sh out/* || true
      - uses: actions/upload-artifact@v4
        with:
          name: graph-band-${{ matrix.band }}
          path: out
          retention-days: 7

  publish:
    needs: band
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: graph-band-*
          path: bands
          merge-multiple: true
      - name: Merge the blocks
        run: |
          python -m tools.graph_etl.merge_index merged/v1 bands/*/v1 | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh merged/v1
          find merged/v1 -size +49M -print -exec false {} + || { echo "::error::a file over 49 MB"; exit 1; }
          python -m tools.graph_etl.check merged/v1 | tail -12 | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Commit to the graph-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(python3 -c "import json; print(json.load(open('merged/v1/index.json'))['tile_count'])")
          mb=$(python3 -c "import json; print(round(json.load(open('merged/v1/index.json'))['bytes']/1e6, 1))")
          bash tools/graph_etl/publish_data.sh merged/v1 v1 "graph region: $(date -u +%F) ($n tiles, $mb MB)"
          echo "graph-data v1: $n tiles, $mb MB" >> "$GITHUB_STEP_SUMMARY"
      # the tiles shipped in the app (Cincinnati) cut from this same build, so the two never diverge
      - name: The bundled Cincinnati tiles from this build
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m tools.graph_etl.bundle merged/v1 web/data/graph/v1 | tee -a "$GITHUB_STEP_SUMMARY"
          python -m tools.graph_etl.check web/data/graph/v1 > web/data/graph/v1/CHECK.txt || true
          git add web/data/graph/v1
          if git diff --cached --quiet; then echo "bundle unchanged"; exit 0; fi
          build=$(python3 -c "import json; print(json.load(open('web/data/graph/v1/index.json'))['build'])")
          git commit -q -m "graph tiles: the bundled Cincinnati set from region build $build"
          # never main: on main the bundle goes to its own branch for a PR
          target="$REF"; [ "$REF" = "main" ] && target="claude/graph-bundle-$build"
          for k in 1 2 3; do
            if [ "$target" = "$REF" ]; then git pull --rebase -q origin "$REF" || true; fi
            git push -q origin "HEAD:refs/heads/$target" && { echo "bundle committed to $target" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep 10
          done
          exit 1

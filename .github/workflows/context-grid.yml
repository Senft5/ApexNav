name: Context grid (route data ETL)

# Builds the context grid (tools/ctx_etl): national public datasets clipped to a region, resampled to a web-mercator grid,
# quantised and packed as z8 bundles for web/route_ctx/context_grid.js. Manual only: the sources change yearly at most.
#
# - preset "cincinnati" (Hamilton, Clermont, Boone, Kenton, Campbell): ~1.3 MB, ~5 min. These bundles are committed in
#   web/data/ctx/v1 (they ship inside the app); download the artifact and commit it to refresh them.
# - optional secret (docs/OWNER_TODO.md): EARTHDATA_TOKEN switches night lights from the 2016 GIBS image to NASA Black
#   Marble VNP46A4 (the newest annual radiance, LAADS DAAC). Without it night lights are built exactly as before.
# - preset "launch" (OH, KY, IN, WV, TN, NC, VA): too big to commit, so with "upload" ticked and the Cloudflare secrets set
#   (docs/OWNER_TODO.md) the bundles go to the Worker's CTX KV namespace, served at /api/ctx/v1/... (backend/src/context_grid.ts).
#
# Runner budget (ubuntu-latest: 4 CPUs, 16 GB RAM, ~14 GB free disk, 6 h per job): the launch region downloads ~3.5 GB
# (Census blocks 1.8 GB, OpenAddresses statewide files ~0.6 GB, FARS 0.2 GB, plus per-chunk NLCD/flood/HPMS queries and
# ~12,400 noise-map tiles) and took about 4 h cold on the build machine (8 threads; 10 of 68 bundles in 37 min,
# 5.7 KB per z12 tile, so about 70 MB in all). A run that hits the limit saves its cache and the next one finishes it. The downloads are cached between runs (restored and saved even when a
# run fails or times out, so a second run picks up where the first stopped).
on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Region preset"
        type: choice
        options: [launch, cincinnati]
        default: launch
      states:
        description: "Override: comma-separated states (e.g. OH,KY)"
        required: false
      bbox:
        description: "Override: west,south,east,north (degrees)"
        required: false
      upload:
        description: "Upload the bundles to the Worker's CTX KV namespace"
        type: boolean
        default: false

concurrency:
  group: context-grid
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CTX_CACHE: ${{ github.workspace }}/.ctx_cache
      OUT: ${{ github.workspace }}/ctx_out/v1
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (the runner's preinstalled SDKs we don't use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / && free -g
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/ctx_etl/requirements.txt
      - name: Restore the download cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ctx_cache
            !.ctx_cache/split
          key: ctx-${{ inputs.preset }}-v1-${{ github.run_id }}
          restore-keys: ctx-${{ inputs.preset }}-v1-
      - name: Build
        env:                                        # inputs through env, never pasted into the script
          PRESET: ${{ inputs.preset }}
          STATES: ${{ inputs.states }}
          BBOX: ${{ inputs.bbox }}
          # the owner's free account (docs/OWNER_TODO.md), optional: without EARTHDATA_TOKEN night lights are the 2016
          # image. tools/ctx_etl/sources.py never logs it.
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          args=(--preset "$PRESET" --out "$OUT" --cache "$CTX_CACHE" --threads 8)
          [ -n "$STATES" ] && args+=(--states "$STATES")
          [ -n "$BBOX" ] && args+=("--bbox=$BBOX")
          python -m tools.ctx_etl.build "${args[@]}"
      - name: Sizes
        if: always()
        run: |
          du -sh "$CTX_CACHE"/* 2>/dev/null || true
          if [ -f "$OUT/index.json" ]; then
            python -c "import json,sys; ix=json.load(open('$OUT/index.json')); print(len(ix['bundles']), 'bundles,', round(ix['bytes']/1e6, 1), 'MB; largest', round(max(b['bytes'] for b in ix['bundles'].values())/1e6, 2), 'MB')" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save the download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .ctx_cache
            !.ctx_cache/split
          key: ctx-${{ inputs.preset }}-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: context-grid-${{ inputs.preset }}
          path: ctx_out/
          retention-days: 30
      - name: Upload to the Worker's KV (CTX)
        if: inputs.upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CTX_KV_ID: ${{ vars.CTX_KV_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CTX_KV_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets and the CTX_KV_ID variable are needed (docs/OWNER_TODO.md)"; exit 1
          fi
          cd "$OUT"
          # bundles first, the index last: a phone never sees an index naming a bundle that isn't there yet
          for f in 8/*/*.vcg; do npx --yes wrangler@4 kv key put "v1/$f" --path "$f" --namespace-id "$CTX_KV_ID" --remote; done
          npx --yes wrangler@4 kv key put "v1/index.json" --path index.json --namespace-id "$CTX_KV_ID" --remote

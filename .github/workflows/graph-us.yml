name: Graph US (own routing, the lower 48)

# Vetta's own scored road network for the lower 48 (docs/OWN_ROUTING.md), hosted for free: ~4 GB a build is too much
# for a git branch, so each build is a GitHub release (graph-us-<build>) of 2 degree packs (tools/graph_etl/pack.py),
# and the graph-data branch's us/v1/current.json names the live one, committed last. The Worker reads a tile as an
# HTTP Range of its pack (backend/src/graph.ts); with no pointer it serves the branch's OH/KY/IN tiles as before.
#
# plan (tools/graph_etl/us_plan.py: Geofabrik's index, the states, one job per 1 degree band x 15 degree chunk)
#   -> osm (one job per state: its extract, kept as an artifact for the bands that need it; Geofabrik asked once each)
#   -> band (each job: its states merged, its 1 degree blocks built one at a time, as graph-region.yml does)
#   -> publish (merge, pack, the release, then the pointer; the two newest US releases are kept)
#
# A pilot (`only`: Geofabrik ids, comma separated) builds the blocks those states touch and makes a release, but the
# pointer moves only for the whole country or with `live` (a pilot would take the rest of the region off the map).
# Triggers: a manual run (once on main), or a push to claude/project-thread-39xbx9 changing tools/graph_etl/US_BUILD
# (its `only=` and `live=` lines), the way to run it before it is on main.
on:
  # monthly, the 1st at 03:23 UTC (the whole lower 48 goes live): roads change slowly, and each build asks Geofabrik for
  # all 49 extracts (~10 GB)
  schedule:
    - cron: "23 3 1 * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Pilot: Geofabrik state ids, comma separated (empty: the lower 48)"
        required: false
        default: ""
      live:
        description: "Point the Worker at this build even if it is a pilot"
        type: boolean
        default: false
      bands_from:
        description: "Publish the bands an earlier run built (its run id; band artifacts keep 3 days): no download, no band"
        required: false
        default: ""
  push:
    branches: [claude/project-thread-39xbx9]
    paths:
      - "tools/graph_etl/US_BUILD"

permissions:
  contents: write
  actions: read

concurrency:
  group: graph-us
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # Geofabrik's index tried for up to 25 min: it refuses a runner that long at times
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      states: ${{ steps.plan.outputs.states }}
      week: ${{ steps.plan.outputs.week }}
      only: ${{ steps.plan.outputs.only }}
      live: ${{ steps.plan.outputs.live }}
      reuse: ${{ steps.plan.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan
        id: plan
        env:
          IN_ONLY: ${{ inputs.only }}
          IN_LIVE: ${{ inputs.live }}
          IN_BANDS: ${{ inputs.bands_from }}
        run: |
          only="$IN_ONLY"; live="$IN_LIVE"
          if [ "${{ github.event_name }}" = "push" ]; then
            only=$(sed -n 's/^only=//p' tools/graph_etl/US_BUILD | head -1)
            live=$(sed -n 's/^live=//p' tools/graph_etl/US_BUILD | head -1)
          fi
          [ -z "$only" ] && live=true
          case "$IN_BANDS" in ""|*[!0-9]*) [ -z "$IN_BANDS" ] || { echo "::error::bands_from is a run id"; exit 1; } ;; esac
          echo "reuse=$IN_BANDS" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "live=${live:-false}" >> "$GITHUB_OUTPUT"
          if [ -n "$IN_BANDS" ]; then
            # publishing an earlier run's bands: no Geofabrik (it refused this runner once, 2026-11-14), no matrix
            none='{"include":[{"job":"none","state":"none"}]}'
            echo "matrix=$none" >> "$GITHUB_OUTPUT"; echo "states=$none" >> "$GITHUB_OUTPUT"
            echo "bands from run $IN_BANDS" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          curl -fsSL --retry 20 --retry-delay 60 --retry-max-time 1500 --retry-all-errors -o index-v1.json https://download.geofabrik.de/index-v1.json
          python3 -c "import json; f=json.load(open('index-v1.json'))['features']; print(len(f), 'extracts;', [x['properties'].get('id') for x in f if 'ohio' in str(x['properties'].get('id'))])"
          python -m tools.graph_etl.us_plan matrix --index index-v1.json --only "$only" > matrix.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          m = json.load(open("matrix.json"))
          from tools.graph_etl.us_plan import urls
          ix = urls(json.load(open("index-v1.json")))
          states = sorted({s for j in m["include"] for s in j["states"].split()})
          print("matrix=" + json.dumps(m, separators=(",", ":")))
          print("states=" + json.dumps({"include": [{"state": s, "url": ix[s]} for s in states]}, separators=(",", ":")))
          PY
          python3 -c "import json; m=json.load(open('matrix.json')); print(len(m['include']), 'jobs')" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -c "import json,sys; sys.exit(0 if json.load(open('matrix.json'))['include'] else 'no jobs: the plan found no state')"

  osm:
    needs: plan
    if: needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4           # gentle on Geofabrik (6 got connections refused)
      matrix: ${{ fromJSON(needs.plan.outputs.states) }}
    steps:
      - name: The extract
        id: get
        # a state refused here is fetched again by osm-again, on another runner (another address)
        continue-on-error: true
        run: |
          mkdir -p osm
          # Geofabrik refuses some runners' addresses for minutes at a time (florida, 2026-11-13: 9 tries over 4 min):
          # three rounds, five minutes apart, before the job fails
          for round in 1 2 3; do
            curl -fSL --retry 8 --retry-delay 30 --retry-all-errors -o "osm/${{ matrix.state }}.osm.pbf" "${{ matrix.url }}" && break
            [ "$round" = 3 ] && exit 1
            echo "round $round refused; waiting 5 min"; sleep 300
          done
          ls -la osm
      - uses: actions/upload-artifact@v4
        if: steps.get.outcome == 'success'
        with:
          name: osm-${{ matrix.state }}
          path: osm
          retention-days: 2
          overwrite: true
          compression-level: 0

  # Geofabrik refuses a runner's address for half an hour or more at times (district-of-columbia, 2026-11-14: every try
  # for 25 min) while the runners beside it download fine: the states left without an extract, fetched once more here,
  # on a fresh runner, one at a time
  osm-again:
    needs: [plan, osm]
    if: needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
      - name: The extracts still missing
        env:
          GH_TOKEN: ${{ github.token }}
          STATES: ${{ needs.plan.outputs.states }}
        run: |
          mkdir -p again
          have=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq '.artifacts[].name')
          echo "$STATES" | python3 -c "import json,sys; [print(j['state'], j['url']) for j in json.load(sys.stdin)['include']]" > states.txt
          : > missing.txt
          while read -r st url; do grep -qx "osm-$st" <<<"$have" || echo "$st $url" >> missing.txt; done < states.txt
          echo "missing: $(wc -l < missing.txt)"; cat missing.txt
          while read -r st url; do
            mkdir -p "again/$st"
            for round in 1 2 3; do
              curl -fSL --retry 8 --retry-delay 30 --retry-all-errors -o "again/$st/$st.osm.pbf" "$url" && break
              [ "$round" = 3 ] && exit 1
              echo "round $round refused; waiting 5 min"; sleep 300
            done
          done < missing.txt
          ls -laR again
      - uses: actions/upload-artifact@v4
        if: hashFiles('again/**/*.pbf') != ''
        with:
          name: osm-again
          path: again
          retention-days: 2
          compression-level: 0

  band:
    needs: [plan, osm, osm-again]
    if: needs.plan.outputs.reuse == ''
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      WORK: /home/runner/graph_work
    steps:
      - uses: actions/checkout@v4
      - name: Free disk, add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -m && df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install -r tools/graph_etl/requirements.txt
      - name: The states under this job's blocks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$WORK/osm"
          for s in ${{ matrix.states }}; do
            for k in 1 2 3; do gh run download "${{ github.run_id }}" -R "${{ github.repository }}" -n "osm-$s" -D "$WORK/osm" && break; sleep 15; done
            # a state Geofabrik refused the first time: osm-again's (one artifact, a folder per state)
            if [ ! -s "$WORK/osm/$s.osm.pbf" ]; then
              [ -d "$WORK/again" ] || gh run download "${{ github.run_id }}" -R "${{ github.repository }}" -n osm-again -D "$WORK/again" || true
              cp "$WORK/again/$s/$s.osm.pbf" "$WORK/osm/" || { echo "::error::no extract for $s"; exit 1; }
            fi
          done
          ls -la "$WORK/osm"
      - name: The region's context grid (graph-data ctx/v1), else Cincinnati's
        run: |
          if git fetch -q --depth 1 origin graph-data && git cat-file -e FETCH_HEAD:ctx/v1/index.json 2>/dev/null; then
            mkdir -p "$WORK/ctx_dl" && git archive FETCH_HEAD ctx | tar -x -C "$WORK/ctx_dl"
            echo "CTX_DIR=$WORK/ctx_dl/ctx/v1" >> "$GITHUB_ENV"
          else
            echo "CTX_DIR=${{ github.workspace }}/web/data/ctx/v1" >> "$GITHUB_ENV"
          fi
      - name: Build the blocks
        env:
          JOB: ${{ matrix.job }}
        run: |
          mkdir -p "$WORK/blocks"
          osmium merge --overwrite -o "$WORK/region.osm.pbf" "$WORK"/osm/*.osm.pbf
          rm -rf "$WORK/osm"
          python -m tools.graph_etl.us_plan blocks --job "$JOB" > "$WORK/blocks.txt"
          cat "$WORK/blocks.txt"
          while read -r name box clip; do
            echo "::group::$name $box"
            osmium extract --overwrite -s smart -b "$clip" -o "$WORK/blocks/$name.osm.pbf" "$WORK/region.osm.pbf"
            # one block failing (out of memory in a big city?) keeps the job's other blocks; the job fails at the end,
            # and a re-run of the failed job builds its blocks again
            if ! python -m tools.graph_etl.build --pbf "$WORK/blocks/$name.osm.pbf" --tiles="$box" --out "out/$name/v1" \
              --work "$WORK/w_$name" --dem-cache "$WORK/dem" --source "Geofabrik US states (merged)" \
              --build "us-${{ needs.plan.outputs.week }}" --ctx "$CTX_DIR"; then
              echo "::error::block $name failed"; echo "$name" >> "$WORK/failed.txt"; rm -rf "out/$name"
            fi
            rm -rf "$WORK/w_$name" "$WORK/blocks/$name.osm.pbf"
            echo "::endgroup::"
          done < "$WORK/blocks.txt"
          du -sh out 2>/dev/null || true
          if [ -s "$WORK/failed.txt" ]; then echo "failed blocks: $(tr '\n' ' ' < "$WORK/failed.txt")" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-us-${{ matrix.name }}
          path: out
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

  publish:
    needs: [plan, band]
    # a whole build, or (bands_from) an earlier run's: 2026-11-14 the publish runner died after 141 bands had built
    if: always() && needs.plan.result == 'success' && (needs.band.result == 'success' || (needs.plan.outputs.reuse != '' && needs.band.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
      id-token: write          # the R2 upload (tools/graph_etl/upload_r2.sh): the Worker checks this run's GitHub OIDC token
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.reuse == ''
        with:
          pattern: graph-us-*
          path: bands
          merge-multiple: true
      # another run's bands: download-artifact lists only the first 100 of another run's artifacts (2026-11-14: 100 of
      # 141 bands published, the rest of the country left out), so each is fetched by id from a paginated listing
      - name: The bands of run ${{ needs.plan.outputs.reuse }}
        if: needs.plan.outputs.reuse != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.plan.outputs.reuse }}
        run: |
          set -o pipefail
          mkdir -p bands
          gh api --paginate "repos/${{ github.repository }}/actions/runs/$RUN/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("graph-us-")) | select(.expired | not) | "\(.id) \(.name)"' > arts.txt
          bands=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/$RUN/jobs?per_page=100" --jq '.jobs[] | select(.name | startswith("band")) | .name' | wc -l)
          echo "$(wc -l < arts.txt) band artifacts for $bands bands in run $RUN" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$(wc -l < arts.txt)" -eq "$bands" ] && [ "$bands" -gt 0 ] || { echo "::error::not every band of run $RUN has its artifact"; exit 1; }
          while read -r id name; do
            for k in 1 2 3 4 5; do gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > a.zip && break; echo "retry $name"; sleep $((k * 10)); done
            unzip -q -o a.zip -d bands && rm a.zip
          done < arts.txt
          ls bands | wc -l
      - name: Merge and pack
        run: |
          python -m tools.graph_etl.merge_index merged/v1 bands/*/v1 | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf bands
          # no tools.graph_etl.check here: its spot roads are Cincinnati's, checked by graph-region.yml on the same build,
          # and 62 million edges through it took the runner down (2026-11-14)
          python -m tools.graph_etl.pack merged/v1 packs | tee -a "$GITHUB_STEP_SUMMARY"
          # the tiles stay for the R2 upload, beside the slim index the Worker serves (a pack's tiles, byte for byte)
          rm -f merged/v1/index.json && cp packs/index.json merged/v1/index.json
          du -sh packs && ls packs | wc -l
      - name: The release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=$(python3 -c "import json; print(json.load(open('packs/index.json'))['build'])")
          tag="graph-us-$build"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "build=$build" >> "$GITHUB_OUTPUT"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "${{ github.sha }}" --latest=false --title "Road graph (lower 48), build $build" \
              --notes "Vetta's own routing tiles, packed (tools/graph_etl/pack.py). Road data (c) OpenStreetMap contributors, ODbL 1.0; elevation Mapzen Terrain Tiles. Pilot: ${{ needs.plan.outputs.only || 'no' }}."
          fi
          # packs first, the two indexes last: a reader that finds index.json finds every pack
          for f in packs/*.bin packs/index.json packs/packs.json; do
            for k in 1 2 3 4 5; do gh release upload "$tag" "$f" --clobber && break; echo "retry $f"; sleep $((k * 20)); done
          done
          echo "release $tag: $(ls packs/*.bin | wc -l) packs" >> "$GITHUB_STEP_SUMMARY"
      - name: Point the Worker at it
        if: needs.plan.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # our bucket first (src/data_store.ts): the Worker serves R2's index before any release, so the build goes live
          # there; it switches only once every tile is in (a 409 otherwise). The release stays the fallback.
          set -o pipefail
          bash tools/graph_etl/upload_r2.sh merged | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p ptr
          printf '{"tag":"%s","build":"%s","at":"%s"}\n' "${{ steps.rel.outputs.tag }}" "${{ steps.rel.outputs.build }}" "$(date -u +%FT%TZ)" > ptr/current.json
          bash tools/graph_etl/publish_data.sh ptr us/v1 "graph us: ${{ steps.rel.outputs.tag }}"
          # keep the two newest US releases (the live one and the one before, for a phone mid-session)
          gh release list --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("graph-us-"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' \
            | while read -r t; do gh release delete "$t" --yes --cleanup-tag || true; done

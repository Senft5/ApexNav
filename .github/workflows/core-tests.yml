name: Core Physics Tests

# push only on main: PR branches are covered by pull_request (they used to run twice).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Invariants, road DNA, and JS/Python parity
        run: python -m pytest tests -v

  apexkit-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: ApexKit parity tests vs core/live_pipeline.py (Linux)
        run: swift test --package-path ApexKit

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # --legacy-peer-deps: the Cloudflare test plugin and wrangler peers disagree on @cloudflare/workers-types
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Privacy and auth tests (the review's pgTAP list, as API tests)
        run: npx vitest run
      - name: The Worker still bundles with its bindings (dry run, no deploy)
        working-directory: .
        run: backend/node_modules/.bin/wrangler deploy --dry-run --outdir /tmp/wr_out

name: Core Physics Tests

# push only on main: PR branches are covered by pull_request (they used to run twice).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One slot per branch: a PR's run (ref refs/pull/N/merge) and a run started by hand on its branch (refs/heads/<branch>)
# used to be two groups, so both ran and each push could queue two full sets of jobs. The newest cancels the rest.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Invariants, road DNA, and JS/Python parity
        run: python -m pytest tests -v

  apexkit-linux:
    runs-on: ubuntu-latest
    # The official Swift image, not swift-actions/setup-swift: that action refreshes the toolchain's GPG keys from
    # keyserver.ubuntu.com on every run, and since 2026-11-11 that times out and fails the job before any Swift builds.
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: ApexKit parity tests vs core/live_pipeline.py (Linux)
        run: swift test --package-path ApexKit

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # --legacy-peer-deps: the Cloudflare test plugin and wrangler peers disagree on @cloudflare/workers-types
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Privacy and auth tests (the review's pgTAP list, as API tests)
        run: npx vitest run
      - name: The Worker still bundles with its bindings (dry run, no deploy)
        working-directory: .
        run: backend/node_modules/.bin/wrangler deploy --dry-run --outdir /tmp/wr_out

  # End-to-end smoke tests of the web app in headless Chromium (IDEAS Y-11, e2e/smoke.js): first run and replay, the live
  # cockpit with big targets and the typing lock, the battery saver, search offline, the Log page. No network needed.
  # Which kinds of files this run changes, so the four e2e jobs sit out a PR that can't change what the browser runs
  # (docs, the Worker, the Python tests and tools, the Swift shells). Pushes to main and runs by hand always run them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ -z "$BASE" ] || ! files=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null); then
            echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          # e2e reads backend/src/private_themes.json; every other path here is outside what the page loads
          rest=$( { echo "$files" | grep -vE '^(docs/|tests/|tools/|ApexKit/|CarPlay/|LiveActivity/|UITests/|Assets\.xcassets/|backend/)|\.(md|swift)$|^(LICENSE|project\.yml|\.github/workflows/(build|status|crash-logs)\.yml)$';
                    echo "$files" | grep -E '^backend/src/private_themes\.json$'; } || true )
          if [ -n "$(echo "$rest" | tr -d '[:space:]')" ]; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi

  e2e-shard:
    name: e2e (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # 2026-11-11: one job ran 173 flows in 28-31 min against a 35 min limit, and with eight threads merging one at a time
    # it was every PR's wait. Four jobs side by side each take a quarter of the flows, dealt longest first (smoke.js SHARD):
    # 6-7 min of flows a job, the longest (safe areas, ~4.5 min) included. The limit keeps over three times that as headroom.
    timeout-minutes: 25
    strategy:
      fail-fast: false            # one shard's failure never hides another's
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
      # the browser download (~100 MB) is kept between runs, keyed by the Playwright version it belongs to
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.63.0-chromium-shell
      # headless launch only needs the shell. The system packages are best effort, with a 5-minute cap: the runner image
      # already has every library Chromium needs (apt only adds fonts), and on 2026-11-11 the Ubuntu mirrors stopped
      # resolving, so --with-deps spent 10 minutes and failed the job before a single flow ran.
      - run: npx playwright install --only-shell chromium
      - name: Browser system packages (best effort)
        run: timeout 300 npx playwright install-deps chromium || echo "::warning::playwright install-deps failed; running with the runner image's own packages"
      - run: node smoke.js
        env:
          SHARD: ${{ matrix.shard }}/4
          SHOTS: shots   # the safe-area flow's contact sheets, one per phone shape (REVIEW2.md U-05)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safe-area-contact-sheets-${{ matrix.shard }}
          path: e2e/shots/
          if-no-files-found: ignore

  # The one check named "e2e", as before the split (branch rules and the threads read it by that name): green only when
  # every shard is, or when the PR changes nothing the browser runs (the shards were skipped on purpose).
  e2e:
    runs-on: ubuntu-latest
    needs: [changes, e2e-shard]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.changes.result }}" = success ] && [ "${{ needs.changes.outputs.web }}" = false ]; then echo "no web change: e2e not needed"; exit 0; fi
          test "${{ needs.e2e-shard.result }}" = success || { echo "an e2e shard did not pass (${{ needs.e2e-shard.result }})"; exit 1; }

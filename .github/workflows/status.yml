name: Status

# Synthetic checks (IDEAS Y-05, tools/status_check.py): every 30 minutes, check the live site, the API and its database,
# and the free services the app depends on. A core failure opens one "outage" issue assigned to the owner; while it lasts,
# the issue gets a comment only when the set of failing checks changes; the first all-clear closes it. Dependency failures
# only show in the run summary. A crash or hang of the check itself fails the run without opening an issue.
# Free: the repo is public. GitHub pauses schedules after 60 days without repository activity (docs/STATUS.md).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: status
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check
        continue-on-error: true
        timeout-minutes: 4
        shell: bash   # -o pipefail: the check's exit code, not tee's
        run: python tools/status_check.py | tee status.md
      - name: Open, update or close the outage issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('status.json')) { core.setFailed('The status check itself crashed or timed out (see the Check step); no issue opened.'); return; }
            const { core_ok, failing } = JSON.parse(fs.readFileSync('status.json', 'utf8'));
            const md = fs.readFileSync('status.md', 'utf8');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const LABEL = 'outage', mark = `<!-- failing: ${failing.join(', ')} -->`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: LABEL, per_page: 1 });
            const issue = open[0];
            if (core_ok) {
              if (issue) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Back up.\n\n${md}\n${run}` });
                await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
              }
              return;
            }
            if (issue) {
              // Comment only when what's failing changed: one note per change, not one every 30 minutes.
              const { data: notes } = await github.rest.issues.listComments({ ...context.repo, issue_number: issue.number, per_page: 100 });
              const last = [issue.body || '', ...notes.map(c => c.body || '')].reverse().find(b => b.includes('<!-- failing:'));
              if (!last || !last.includes(mark)) await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Now failing: ${failing.join(', ')}.\n\n${md}\n${run}\n${mark}` });
              core.warning(`Still down: ${failing.join(', ')} (issue #${issue.number})`);
              return;
            }
            // The dedupe above finds the issue by its label, so make sure the label exists before the first issue needs it.
            try { await github.rest.issues.getLabel({ ...context.repo, name: LABEL }); }
            catch (e) { if (e.status === 404) await github.rest.issues.createLabel({ ...context.repo, name: LABEL, color: 'b60205', description: 'Opened by the Status workflow' }); else throw e; }
            const { data: made } = await github.rest.issues.create({ ...context.repo, title: 'ApexNav is down', labels: [LABEL], assignees: [context.repo.owner],
              body: `The status check found ApexNav's own site or API failing. docs/STATUS.md says what to do.\n\n${md}\n${run}\n${mark}` });
            core.warning(`ApexNav is down: ${failing.join(', ')} (opened issue #${made.number})`);

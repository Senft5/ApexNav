name: iOS Build & Simulator Tests

# macOS minutes count 10x on a private repo (2,000 free minutes a month) and the simulator run is slow.
# Pull requests run the iOS jobs only when native code changes; web-only PRs skip them. Every merge to
# main runs them for anything that ships in the app (web/ is bundled), so a web change that breaks the
# iOS shell shows up on main right after merge. Run by hand any time with workflow_dispatch.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'tests/**', 'tools/**', 'web/voices/**', '**.md', 'LICENSE', 'wrangler.jsonc']
  pull_request:
    paths: ['ApexNavApp.swift', 'Assets.xcassets/**', 'ApexKit/**', 'UITests/**', 'project.yml', '.github/workflows/build.yml']
  workflow_dispatch:

# A newer push to a PR cancels its older run. On main a run in progress always finishes (a newer merge waits, and only
# the newest waiting one runs next): with threads merging minutes apart, cancelling left main with no finished iOS build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apexkit-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: ApexKit unit + parity tests (macOS)
        run: swift test --package-path ApexKit

  simulator-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl privacy "$UDID" grant location com.senft.ApexNav || true
          xcrun simctl location "$UDID" set 39.2575,-84.6015 || true
      - name: Build and run UI tests on the simulator
        run: |
          xcodebuild test \
            -project ApexNav.xcodeproj \
            -scheme ApexNav \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p shots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path shots || true
          ls -la shots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-results
          path: |
            TestResults.xcresult
            shots

  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compile Unsigned iOS App
        run: |
          xcodebuild build \
            -project ApexNav.xcodeproj \
            -scheme ApexNav \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Sideloadly .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ApexNav.app Payload/
          zip -r ApexNav.ipa Payload

      - name: Upload ApexNav.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexNav-IPA
          path: ApexNav.ipa

  # TestFlight: every main run that builds the app (and any workflow_dispatch on main) archives, signs and uploads it.
  # Signing is automatic through an App Store Connect API key (-allowProvisioningUpdates), so there are no certificates
  # or profiles in the repo or the secrets. Until all four secrets exist the gate says no and the upload job is skipped.
  testflight-gate:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "TestFlight upload skipped: missing secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  testflight:
    needs: [testflight-gate, apexkit-macos, simulator-tests]
    if: needs.testflight-gate.outputs.ready == 'true'
    # App Store Connect only takes builds made with the iOS 26 SDK (Xcode 26) or later; macos-15 defaults to Xcode 16.
    runs-on: macos-26
    env:
      # Build numbers only go up: the workflow's run number, plus the attempt so a re-run doesn't collide with itself.
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode 26 or later
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          [ "${SDK%%.*}" -ge 26 ] || { echo "::error::iOS SDK $SDK is older than 26; App Store Connect will refuse the upload."; exit 1; }

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # Accept the .p8 as pasted text or as base64 of the file.
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive (automatic signing)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project ApexNav.xcodeproj \
            -scheme ApexNav \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ApexNav.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ApexNav.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded ApexNav build $BUILD_NUMBER to App Store Connect; it shows in TestFlight after Apple's processing (usually 5-30 min)." >> "$GITHUB_STEP_SUMMARY"

      # xcodebuild's own error ("Error Downloading App Information") hides Apple's reason; it is in the distribution logs.
      - name: Show the distribution log
        if: failure()
        run: |
          for log in $(find "${TMPDIR:-/tmp}" -path '*.xcdistributionlogs/IDEDistribution*.log' 2>/dev/null); do
            echo "::group::$log"
            grep -iE -B2 -A8 'error|status code|failed|not found|forbidden|unauthori' "$log" | tail -200
            echo "::endgroup::"
          done

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

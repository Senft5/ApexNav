# TestFlight feedback: crash reports and screenshot feedback shared from the phone, printed without personal details;
# the screenshots go to an artifact kept one day.
# On demand only.
name: Crash logs
on: workflow_dispatch
permissions:
  contents: read
jobs:
  crashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install "pyjwt[crypto]"
      - name: Fetch
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          tools/write_asc_key.sh "$KEY"   # the PEM rebuilt as the TestFlight job does
          ASC_KEY_PATH="$KEY" python tools/crash_logs.py
          rm -f "$KEY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-screenshots
          path: feedback/
          retention-days: 1
          if-no-files-found: ignore

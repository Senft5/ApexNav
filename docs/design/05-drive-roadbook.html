<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Driving, Roadbook</title>
<meta name="description" content="Driving in the Roadbook theme">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#3A3A3A;font-family:-apple-system, 'SF Pro Text', 'Helvetica Neue', Inter, Arial, sans-serif;color:#1C1A17;-webkit-font-smoothing:antialiased;display:flex;align-items:flex-start;justify-content:center;padding:24px 0}
.phone{position:relative;width:390px;height:844px;background:#EDE4D3;overflow:hidden;color:#1C1A17;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.status{position:absolute;top:0;left:0;right:0;height:47px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 8px;font-size:15px;font-weight:600;z-index:30;pointer-events:none}
.status .cell{display:flex;gap:5px;align-items:center}
.cond{font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace}
.tabs{position:absolute;left:0;right:0;bottom:0;height:82px;background:#EDE4D3;border-top:2px solid #1C1A17;display:flex;padding:8px 6px 0;z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#6A6255;position:relative}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#C8102E}
.tab.on::before{content:"";position:absolute;top:-10px;left:22px;right:22px;height:3px;background:#C8102E}
.home{position:absolute;bottom:8px;left:125px;width:140px;height:5px;border-radius:3px;background:#1C1A17;opacity:.8;z-index:31}
.rule{border-top:1px solid #CFC4AE}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;font-size:15px;font-weight:600;border:1.5px solid #1C1A17;color:#1C1A17;background:transparent;font-family:-apple-system, 'SF Pro Text', 'Helvetica Neue', Inter, Arial, sans-serif}
.btn.primary{background:#1C1A17;color:#EDE4D3;border-color:#1C1A17}
.btn.record{background:#C8102E;color:#FFFFFF;border-color:#C8102E;height:52px;font-size:16px;font-weight:700;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28)}
.btn.record .dot{width:12px;height:12px;border-radius:50%;background:#FFFFFF}
.btn.text{border:none;text-decoration:underline;text-underline-offset:3px;padding:0 6px}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6A6255}
.pencil{color:#6A6255}
.red{color:#C8102E}

.hazard{position:absolute;left:12px;display:flex;align-items:center;gap:10px;background:#111111;border:2px solid #FF7A1A;
  color:#FFFFFF;padding:8px 12px 8px 10px;font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-weight:800;font-size:20px;letter-spacing:.02em;line-height:1;
  box-shadow:0 2px 0 rgba(0,0,0,.35)}
.hazard .glyph{width:26px;height:26px;flex:none}
.hazard small{display:block;font-family:-apple-system, 'SF Pro Text', 'Helvetica Neue', Inter, Arial, sans-serif;font-weight:600;font-size:12px;letter-spacing:0;color:#FFB27A;margin-top:3px}


.notes{position:absolute;top:0;left:0;right:0;height:132px;background:#EDE4D3;border-bottom:2px solid #1C1A17;display:flex;align-items:center;padding:44px 12px 0;z-index:10}
.dist{width:64px;text-align:center}
.dist b{display:block;font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-size:40px;font-weight:800;line-height:.9}
.dist span{font-size:11px;font-weight:600;letter-spacing:.08em;color:#6A6255}
.call{flex:1;font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-size:21px;font-weight:800;letter-spacing:.01em;line-height:1.05;padding-left:8px;text-transform:uppercase}
.call em{font-style:normal;color:#C8102E}
.call small{display:block;font-size:15px;letter-spacing:.06em;color:#6A6255;margin-top:3px}
.next{border-left:1.5px solid #1C1A17;padding-left:8px;display:flex;align-items:center;gap:4px;color:#6A6255;font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-weight:800;font-size:17px;text-transform:uppercase;white-space:nowrap}
.next b{display:block;font-size:20px;color:#1C1A17;line-height:1}
.next small{font-size:10px;font-family:-apple-system, 'SF Pro Text', 'Helvetica Neue', Inter, Arial, sans-serif;font-weight:600;letter-spacing:.06em}
.bin{position:absolute;left:0;right:0;bottom:0;height:290px;background:#EDE4D3;border-top:2px solid #1C1A17;z-index:10;padding:10px 14px 0}
.statusrow{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.statusrow .rec{display:inline-flex;align-items:center;gap:6px;color:#C8102E}
.statusrow .rec i{width:10px;height:10px;border-radius:50%;background:#C8102E}
.statusrow .sp{flex:1;color:#6A6255;font-weight:500}
.statusrow .btn{height:40px;padding:0 14px;font-size:14px}
.cluster{display:grid;grid-template-columns:150px 1fr 100px;gap:8px;margin-top:10px;align-items:center}
.speed{position:relative;height:150px}
.speed svg{width:150px;height:150px;display:block}
.speed .num{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-size:40px;font-weight:800;line-height:1}
.speed .unit{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:10px;font-weight:600;letter-spacing:.1em;color:#6A6255}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.limit{width:56px;height:68px;border:2.5px solid #1C1A17;background:#FFFFFF;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system, 'SF Pro Text', 'Helvetica Neue', Inter, Arial, sans-serif;font-weight:700;line-height:1;border-radius:4px}
.limit small{font-size:9px;letter-spacing:.04em}
.limit b{font-size:26px;margin-top:2px}
.drum{display:flex;gap:2px;align-items:center}
.drum span{width:20px;height:28px;background:#FFFFFF;border:1.5px solid #1C1A17;color:#111;display:flex;align-items:center;justify-content:center;font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-weight:800;font-size:20px;box-shadow:inset 0 6px 6px -6px rgba(0,0,0,.6), inset 0 -6px 6px -6px rgba(0,0,0,.6)}
.drum span.tenth{background:#1C1A17;color:#EDE4D3}
.drum i{font-style:normal;font-weight:800;margin:0 1px}
.mid .lbl{font-size:11px;color:#6A6255;font-weight:600}
.smooth{text-align:center}
.smooth svg{width:96px;height:96px;display:block;margin:0 auto}
.smooth b{display:block;font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-size:22px;font-weight:800;line-height:1}
.smooth span{font-size:10px;font-weight:600;letter-spacing:.08em;color:#6A6255}

</style></head>

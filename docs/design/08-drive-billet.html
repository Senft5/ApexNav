<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Driving, Billet</title>
<meta name="description" content="Driving in the Billet theme, machined metal and red glow">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#3A3A3A;font-family:-apple-system, 'SF Pro Text', 'Helvetica Neue', Inter, Arial, sans-serif;color:#E6E3DC;-webkit-font-smoothing:antialiased;display:flex;align-items:flex-start;justify-content:center;padding:24px 0}
.phone{position:relative;width:390px;height:844px;background:#1A1B1D;overflow:hidden;color:#E6E3DC;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.status{position:absolute;top:0;left:0;right:0;height:47px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 8px;font-size:15px;font-weight:600;z-index:30;pointer-events:none}
.status .cell{display:flex;gap:5px;align-items:center}
.cond{font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace}
.tabs{position:absolute;left:0;right:0;bottom:0;height:82px;background:#1A1B1D;border-top:2px solid #9A9DA3;display:flex;padding:8px 6px 0;z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#8A8B8E;position:relative}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#FF2A2A}
.tab.on::before{content:"";position:absolute;top:-10px;left:22px;right:22px;height:3px;background:#FF2A2A}
.home{position:absolute;bottom:8px;left:125px;width:140px;height:5px;border-radius:3px;background:#E6E3DC;opacity:.8;z-index:31}
.rule{border-top:1px solid #34373B}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;font-size:15px;font-weight:600;border:1.5px solid #E6E3DC;color:#E6E3DC;background:transparent;font-family:-apple-system, 'SF Pro Text', 'Helvetica Neue', Inter, Arial, sans-serif}
.btn.primary{background:#E6E3DC;color:#1A1B1D;border-color:#E6E3DC}
.btn.record{background:#FF2A2A;color:#FFFFFF;border-color:#FF2A2A;height:52px;font-size:16px;font-weight:700;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28)}
.btn.record .dot{width:12px;height:12px;border-radius:50%;background:#FFFFFF}
.btn.text{border:none;text-decoration:underline;text-underline-offset:3px;padding:0 6px}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8A8B8E}
.pencil{color:#8A8B8E}
.red{color:#FF2A2A}

.hazard{position:absolute;left:12px;display:flex;align-items:center;gap:10px;background:#111111;border:2px solid #FF7A1A;
  color:#FFFFFF;padding:8px 12px 8px 10px;font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-weight:800;font-size:20px;letter-spacing:.02em;line-height:1;
  box-shadow:0 2px 0 rgba(0,0,0,.35)}
.hazard .glyph{width:26px;height:26px;flex:none}
.hazard small{display:block;font-family:-apple-system, 'SF Pro Text', 'Helvetica Neue', Inter, Arial, sans-serif;font-weight:600;font-size:12px;letter-spacing:0;color:#FFB27A;margin-top:3px}


.metal{background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),
  linear-gradient(180deg,#3A3C40 0%,#2A2C30 35%,#1F2124 60%,#2B2D31 100%)}
.notes{position:absolute;top:0;left:0;right:0;height:132px;border-bottom:3px solid #0A0A0B;display:flex;align-items:center;padding:44px 12px 0;z-index:10;box-shadow:inset 0 -1px 0 rgba(255,255,255,.12)}
.led{color:#FF2A2A;text-shadow:0 0 10px rgba(255,42,42,.8),0 0 2px rgba(255,120,120,.9)}
.dist{width:72px;text-align:center}
.dist b{display:block;font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-size:40px;font-weight:800;line-height:.9}
.dist span{font-size:10px;font-weight:700;letter-spacing:.14em;color:#8A8B8E}
.call{flex:1;font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-size:21px;font-weight:800;letter-spacing:.01em;line-height:1.05;padding-left:8px;text-transform:uppercase;color:#F2F0EA}
.call small{display:block;font-size:15px;letter-spacing:.06em;color:#8A8B8E;margin-top:3px}
.next{border-left:1px solid #4A4D52;padding-left:8px;font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-weight:800;font-size:17px;text-transform:uppercase;color:#8A8B8E;line-height:1.1;white-space:nowrap}
.next small{display:block;font-family:-apple-system, 'SF Pro Text', 'Helvetica Neue', Inter, Arial, sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em}
.next b{color:#F2F0EA}
.bin{position:absolute;left:0;right:0;bottom:0;height:290px;border-top:3px solid #0A0A0B;z-index:10;padding:10px 14px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.screws{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8A8D93,#2A2C30 70%);box-shadow:0 1px 0 rgba(255,255,255,.15)}
.screws::after{content:"";position:absolute;left:1.5px;right:1.5px;top:4px;height:2px;background:#101113;transform:rotate(30deg)}
.statusrow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:#D8D6D0}
.statusrow .rec{display:inline-flex;align-items:center;gap:6px}
.statusrow .rec i{width:10px;height:10px;border-radius:50%;background:#FF2A2A;box-shadow:0 0 8px #FF2A2A}
.statusrow .sp{flex:1;color:#8A8B8E}
.key{height:38px;padding:0 14px;border-radius:3px;background:linear-gradient(#4A4D52,#2A2C30);border:1px solid #0E0F10;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 #0A0A0B;color:#ECEAE4;font-size:13px;font-weight:700;display:inline-flex;align-items:center;letter-spacing:.02em}
.key.end{color:#FF2A2A;text-shadow:0 0 6px rgba(255,42,42,.6)}
.cluster{display:grid;grid-template-columns:160px 1fr 96px;gap:8px;margin-top:10px;align-items:center}
.gauge{position:relative}
.gauge svg{display:block}
.gauge .num{position:absolute;left:0;right:0;text-align:center;font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-weight:800;line-height:1}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.limit{width:56px;height:68px;border:2.5px solid #F2F0EA;background:#FFFFFF;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1;border-radius:4px}
.limit small{font-size:9px}
.limit b{font-size:26px;margin-top:2px}
.readout{background:#0A0B0C;border:1px solid #0A0A0B;box-shadow:inset 0 2px 6px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.12);padding:4px 10px;font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-size:24px;font-weight:800;letter-spacing:.06em;min-width:96px;text-align:center}
.lbl{font-size:10px;font-weight:700;letter-spacing:.14em;color:#8A8B8E}

</style></head>

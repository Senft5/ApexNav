<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Driving, Tapedeck</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#3A3A3A;font-family:-apple-system, 'SF Pro Text', 'Helvetica Neue', Inter, Arial, sans-serif;color:#7DF5DE;-webkit-font-smoothing:antialiased;display:flex;align-items:flex-start;justify-content:center;padding:24px 0}
.phone{position:relative;width:390px;height:844px;background:#0B0F12;overflow:hidden;color:#7DF5DE;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.status{position:absolute;top:0;left:0;right:0;height:47px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 8px;font-size:15px;font-weight:600;z-index:30;pointer-events:none}
.status .cell{display:flex;gap:5px;align-items:center}
.cond{font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace}
.tabs{position:absolute;left:0;right:0;bottom:0;height:82px;background:#0B0F12;border-top:2px solid #7DF5DE;display:flex;padding:8px 6px 0;z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#2F8F84;position:relative}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#FF8A3D}
.tab.on::before{content:"";position:absolute;top:-10px;left:22px;right:22px;height:3px;background:#FF8A3D}
.home{position:absolute;bottom:8px;left:125px;width:140px;height:5px;border-radius:3px;background:#7DF5DE;opacity:.8;z-index:31}
.rule{border-top:1px solid #17333A}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;font-size:15px;font-weight:600;border:1.5px solid #7DF5DE;color:#7DF5DE;background:transparent;font-family:-apple-system, 'SF Pro Text', 'Helvetica Neue', Inter, Arial, sans-serif}
.btn.primary{background:#7DF5DE;color:#0B0F12;border-color:#7DF5DE}
.btn.record{background:#FF8A3D;color:#FFFFFF;border-color:#FF8A3D;height:52px;font-size:16px;font-weight:700;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28)}
.btn.record .dot{width:12px;height:12px;border-radius:50%;background:#FFFFFF}
.btn.text{border:none;text-decoration:underline;text-underline-offset:3px;padding:0 6px}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#2F8F84}
.pencil{color:#2F8F84}
.red{color:#FF8A3D}

.hazard{position:absolute;left:12px;display:flex;align-items:center;gap:10px;background:#111111;border:2px solid #FF7A1A;
  color:#FFFFFF;padding:8px 12px 8px 10px;font-family:'SF Pro Display', 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-weight:800;font-size:20px;letter-spacing:.02em;line-height:1;
  box-shadow:0 2px 0 rgba(0,0,0,.35)}
.hazard .glyph{width:26px;height:26px;flex:none}
.hazard small{display:block;font-family:-apple-system, 'SF Pro Text', 'Helvetica Neue', Inter, Arial, sans-serif;font-weight:600;font-size:12px;letter-spacing:0;color:#FFB27A;margin-top:3px}


.notes{position:absolute;top:0;left:0;right:0;height:132px;background:linear-gradient(#0E1418,#080C0F);border-bottom:2px solid #1E3A40;display:flex;align-items:center;padding:44px 12px 0;z-index:10;box-shadow:inset 0 -1px 0 rgba(125,245,222,.25)}
.glow{color:#7DF5DE;text-shadow:0 0 8px rgba(125,245,222,.75),0 0 2px rgba(125,245,222,.9)}
.amberglow{color:#FFB347;text-shadow:0 0 8px rgba(255,179,71,.7)}
.dist{width:112px;display:flex;flex-direction:column;align-items:center}
.dist span{font-family:ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace;font-size:10px;letter-spacing:.2em;color:#2F8F84;margin-top:2px}
.call{flex:1;font-family:ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace;font-size:19px;font-weight:700;letter-spacing:.08em;line-height:1.25;padding-left:10px;text-transform:uppercase}
.call em{font-style:normal}
.next{border-left:1px solid #1E3A40;padding-left:10px;font-family:ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace;font-size:12px;letter-spacing:.1em;color:#2F8F84;text-transform:uppercase;line-height:1.5}
.next b{display:block;font-size:14px;color:#7DF5DE}
.bin{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(#0D1316,#070A0C 60%,#0B1013);border-top:2px solid #1E3A40;z-index:10;padding:10px 14px 0}
.bin::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none}
.statusrow{display:flex;align-items:center;gap:10px;font-family:ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.statusrow .rec{display:inline-flex;align-items:center;gap:6px;color:#FF8A3D;text-shadow:0 0 6px rgba(255,138,61,.7)}
.statusrow .rec i{width:8px;height:8px;border-radius:50%;background:#FF8A3D;box-shadow:0 0 6px #FF8A3D}
.statusrow .sp{flex:1;color:#2F8F84;white-space:nowrap;overflow:hidden}
.key{height:36px;padding:0 12px;border:1px solid #2A4A50;border-bottom-width:3px;background:linear-gradient(#1A2428,#0D1417);color:#7DF5DE;font-family:ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center}
.key.end{color:#FFB347;border-color:#4A3A1A}
.cluster{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px;align-items:start}
.speedbox{display:flex;flex-direction:column;align-items:flex-start}
.speedbox .u{font-family:ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace;font-size:10px;letter-spacing:.2em;color:#2F8F84;margin-top:2px}
.panel{display:flex;align-items:flex-end;gap:12px}
.panel .lbl{font-family:ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace;font-size:9px;letter-spacing:.2em;color:#2F8F84;display:block;margin-bottom:3px}
.limit{display:inline-flex;flex-direction:column;align-items:center;font-family:ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace;color:#7DF5DE;border:1px solid #2A4A50;padding:4px 8px}
.limit small{font-size:8px;letter-spacing:.15em;color:#2F8F84}
.limit b{font-size:20px;font-weight:700}
.trip{font-family:ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace;font-size:22px;letter-spacing:.06em}
.matrixrow{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #15282C;padding-top:8px;margin-top:2px}
.mascot{display:flex;align-items:center;gap:10px}
.mascot .say{font-family:ui-monospace, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace;font-size:11px;letter-spacing:.1em;color:#2F8F84;text-transform:uppercase;line-height:1.5;white-space:nowrap}
.mascot .say b{color:#7DF5DE;display:block}
.tape{position:absolute;right:14px;top:8px;width:7px;height:7px;border-radius:50%;background:#FFB347;box-shadow:0 0 6px #FFB347}

</style></head>

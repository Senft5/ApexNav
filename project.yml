name: ApexNav
options:
  bundleIdPrefix: com.senft
  deploymentTarget:
    iOS: "17.0"
packages:
  ApexKit:
    path: ApexKit
  # The car's map (CarPlay/ApexCarMap.swift, REVIEW_FEEL.md F-07): MapLibre Native for iOS, Metal. 6.31.0 (2026-09-11);
  # the distribution repo's Package.swift is a binary target of the release's dynamic xcframework, embedded by Xcode.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
targets:
  ApexNav:
    type: application
    platform: iOS
    sources:
      - path: ApexNavApp.swift
      - path: ApexIntents.swift                         # Siri and Shortcuts (IDEAS V-07)
      - path: ApexBuildNotifier.swift                   # new steps on builds you follow (REVIEW.md 5.3)
      - path: ApexCrashReports.swift                    # native crashes and hangs (MetricKit) to /api/errors
      - path: ApexPush.swift                            # push notifications: the device token and a tap (docs/SOCIAL.md 2.12)
      - path: CarPlay/ApexCarPlay.swift                 # the car's screen (docs/CARPLAY.md)
      - path: CarPlay/ApexCarMap.swift                  # its map, MapLibre Native (F-07)
      - path: LiveActivity/ApexDriveAttributes.swift   # shared with the ApexNavLive extension
      - path: Assets.xcassets      # AppIcon: web/brand/icon-1024.png (single-size iOS icon)
      # Apple's privacy manifest (required for App Store uploads): no tracking, the App Privacy answers in docs/LISTING.md, and
      # why the app reads UserDefaults (its own settings) and the system uptime (motion timing). tests/test_privacy_manifest.py
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: web
        type: folder
        buildPhase: resources
    dependencies:
      - package: ApexKit
      - package: MapLibre
        product: MapLibre
      - target: ApexNavLive          # the drive's Live Activity (IDEAS U-11), embedded in the app
    # Sign in with Apple (IDEAS O-05, App Review 4.8). The App ID has the capability (enabled through the App Store Connect API).
    # CarPlay navigation (docs/CARPLAY.md): Apple assigned com.apple.developer.carplay-maps to the account on 2026-10-29, so
    # device builds carry it too; cloud signing (-allowProvisioningUpdates) puts it on the App ID and the profile.
    entitlements:
      path: ApexNav.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.carplay-maps: true
        # push notifications (ApexPush.swift); the App Store export signs it as production
        aps-environment: development
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only: an iPad build must support every orientation or App Store Connect rejects the upload.
        TARGETED_DEVICE_FAMILY: "1"
        # The version people see. CI's TestFlight job sets CURRENT_PROJECT_VERSION (the build number) per run.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Vetta"
        NSSupportsLiveActivities: true
        # "Open in ApexNav" for GPX files from Files, Mail and AirDrop (IDEAS R-26). Read once through a security-scoped URL
        # (openFile), never edited; LSSupportsOpeningDocumentsInPlace is set once, below, with UIFileSharingEnabled.
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX route
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.topografix.gpx]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX route
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Only standard HTTPS/TLS: skips the export-compliance question on every TestFlight build.
        ITSAppUsesNonExemptEncryption: false
        # the launch screen is the night panel colour, not white, so opening the app doesn't flash (review 2026-10-28), with
        # the Vetta lockup (mark + wordmark, 184 x 50 pt, Assets.xcassets/LaunchLogo) centred on the screen: the page's
        # opening cover (web/boot.js) draws the same lockup at the same size and place, so launch to app is one frame (U-80)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        # The car's screen is its own scene (CarPlay/ApexCarPlay.swift); the phone keeps SwiftUI's window scene.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          # Apple: these two belong inside the scene manifest. At the Info.plist's top level (where they sat until
          # 2026-11-01) CarPlay never offered Vetta on the Dashboard or the cluster (the owner: "it's not working for me").
          CPSupportsDashboardNavigationScene: true
          CPSupportsInstrumentClusterNavigationScene: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ApexCarPlaySceneDelegate
            # the CarPlay Dashboard's map and the car's own instrument cluster (supported cars): our map again
            CPTemplateApplicationDashboardSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationDashboardScene
                UISceneConfigurationName: CarPlay-Dashboard
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ApexCarDashboardSceneDelegate
            CPTemplateApplicationInstrumentClusterSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationInstrumentClusterScene
                UISceneConfigurationName: CarPlay-Cluster
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ApexCarClusterSceneDelegate
        # Portrait, or landscape for landscape mounts (IDEAS U-16: the cockpit has a landscape layout)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocationWhenInUseUsageDescription: "Required for live turn-by-turn navigation and road-feel mapping."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Required for live turn-by-turn navigation and road-feel mapping."
        NSMotionUsageDescription: "Required to paint live G-load and surface feel onto the road map."
        # the spot dialog's photo picker offers Take Photo (IDEAS S-18); without this string iOS ends the app
        NSCameraUsageDescription: "Lets you take a photo of a spot you save. The photo stays on this phone."
        # route context (web/route_ctx/ios_context.js, ApexContext): asked only when the driver taps My free time / This album
        NSCalendarsFullAccessUsageDescription: "When you tap My free time, Vetta reads when your next event starts to size a drive that gets you back in time. Only the start time is used, on this phone."
        NSCalendarsUsageDescription: "When you tap My free time, Vetta reads when your next event starts to size a drive that gets you back in time. Only the start time is used, on this phone."
        NSAppleMusicUsageDescription: "When you tap This album, Vetta reads how long the album you're playing has left to size a drive as long as it. Nothing leaves this phone."
        UIBackgroundModes:
          - location
          - audio
          - fetch                                         # builds you follow: a local notification per new step (ApexBuildNotifier.swift)
        BGTaskSchedulerPermittedIdentifiers:
          - com.senft.ApexNav.builds
        # Exports show in Files → On My iPhone → APEX NAV (needs both); a GPX opened from Files is read in place, never written
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # "Open in the app" links from the web: apexnav://open?invite=…|crew=…|add=…|convoy=… (ApexWebBundle.linkItems / linkEntryURL)
        CFBundleURLTypes:
          - CFBundleURLName: com.senft.ApexNav.links
            CFBundleURLSchemes:
              - apexnav
  # The drive's Live Activity on the lock screen and in the Dynamic Island (IDEAS U-11). Its version and build number must
  # match the app's: CI's CURRENT_PROJECT_VERSION applies to every target.
  ApexNavLive:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: "Vetta"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senft.ApexNav.LiveActivity
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
  ApexNavUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ApexNav
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ApexNav:
    build:
      targets:
        ApexNav: all
        ApexNavUITests: [test]
    test:
      targets:
        - ApexNavUITests

name: ApexNav
options:
  bundleIdPrefix: com.senft
  deploymentTarget:
    iOS: "17.0"
packages:
  ApexKit:
    path: ApexKit
targets:
  ApexNav:
    type: application
    platform: iOS
    sources:
      - path: ApexNavApp.swift
      - path: web
        type: folder
        buildPhase: resources
    dependencies:
      - package: ApexKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "APEX NAV"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Required for live turn-by-turn navigation and road-feel mapping."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Required for live turn-by-turn navigation and road-feel mapping."
        NSMotionUsageDescription: "Required to paint live G-load and surface feel onto the road map."
        UIBackgroundModes:
          - location
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
  ApexNavUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ApexNav
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ApexNav:
    build:
      targets:
        ApexNav: all
        ApexNavUITests: [test]
    test:
      targets:
        - ApexNavUITests

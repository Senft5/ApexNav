name: ApexNav
options:
  bundleIdPrefix: com.senft
  deploymentTarget:
    iOS: "17.0"
packages:
  ApexKit:
    path: ApexKit
targets:
  ApexNav:
    type: application
    platform: iOS
    sources:
      - path: ApexNavApp.swift
      - path: Assets.xcassets      # AppIcon: web/brand/icon-1024.png (single-size iOS icon)
      - path: web
        type: folder
        buildPhase: resources
    dependencies:
      - package: ApexKit
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "APEX NAV"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Required for live turn-by-turn navigation and road-feel mapping."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Required for live turn-by-turn navigation and road-feel mapping."
        NSMotionUsageDescription: "Required to paint live G-load and surface feel onto the road map."
        UIBackgroundModes:
          - location
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # "Open in the app" links from the web: apexnav://open?invite=…|crew=…|add=…|convoy=… (ApexWebBundle.entryURL(forLink:))
        CFBundleURLTypes:
          - CFBundleURLName: com.senft.ApexNav.links
            CFBundleURLSchemes:
              - apexnav
  ApexNavUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ApexNav
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ApexNav:
    build:
      targets:
        ApexNav: all
        ApexNavUITests: [test]
    test:
      targets:
        - ApexNavUITests

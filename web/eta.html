<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Vetta · Arrival time</title>
  <link rel="icon" href="brand/mark.svg" type="image/svg+xml" />
  <!-- the faces are `optional` (fonts.css): preloaded, they are here for the first frame, as on the cockpit -->
  <link rel="preload" href="fonts/inter-tight.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <style>
    /* Vetta Line (docs/design/SIGNATURE.md): paper, ink and one red dot; the minutes in the numeral face, read across a room */
    :root { --paper: #ece3d3; --ink: #1b1914; --dim: #5f594d; --hair: rgba(27, 25, 20, 0.16); --red: #c8102e;
      --num: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; --ui: 'Inter Tight', system-ui, -apple-system, sans-serif; }
    @media (prefers-color-scheme: dark) { :root { --paper: #14120f; --ink: #ede4d3; --dim: #a69d8c; --hair: rgba(237, 228, 211, 0.18); --red: #e65252; } }
    html { color-scheme: light dark; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.45 var(--ui); -webkit-text-size-adjust: 100%; }
    main { max-width: 520px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) calc(20px + env(safe-area-inset-left, 0px)); }
    /* the status bar's band: text scrolling up passes under it, never visibly behind the Dynamic Island or notch */
    body::before { content: ""; position: fixed; z-index: 100; left: 0; right: 0; top: 0; height: env(safe-area-inset-top, 0px); background: var(--paper); }
    .mark { display: block; width: 36px; height: 36px; margin-bottom: 36px; }
    h1 { margin: 0; font: 800 40px/1.05 var(--num); letter-spacing: 0.005em; overflow-wrap: anywhere; }
    /* "@nate is about | 14 | min away": the who in the sentence face, the minutes as the page's one big number */
    h1 .lead { display: block; margin-bottom: 4px; font: 600 22px/1.3 var(--ui); letter-spacing: 0; }
    h1 .num { font-size: 128px; line-height: 0.9; font-variant-numeric: tabular-nums; }
    h1 .unit { font-size: 40px; margin-left: 6px; white-space: nowrap; }
    #sub { margin: 22px 0 0; padding-top: 14px; border-top: 1px solid var(--hair); font: 700 26px/1.2 var(--num); letter-spacing: 0.01em; }
    #sub:empty { display: none; }
    #note { margin: 10px 0 0; color: var(--dim); font-size: 15px; }
    #note:empty { display: none; }
    /* the apex dot: red while the time is fresh, an empty ring once it has gone quiet */
    main[data-state="live"] #note::before, main[data-state="stale"] #note::before { content: ""; display: inline-block; width: 8px; height: 8px;
      margin: 0 8px 1px 0; border-radius: 50%; vertical-align: middle; background: var(--red); }
    main[data-state="stale"] #note::before { background: none; box-shadow: inset 0 0 0 1.5px var(--dim); }
    footer { margin-top: 56px; padding-top: 14px; border-top: 1px solid var(--hair); color: var(--dim); font-size: 15px; }
    footer a { color: var(--ink); }
  </style>
</head>
<body>
<main>
  <!-- the mark (brand/mark.svg) inline, so its ink follows the page's paper by day and by night -->
  <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="Vetta"><g transform="translate(-7 0)">
    <circle cx="34" cy="84" r="8" fill="currentColor"/><path d="M34 84 V52 Q34 26 62 21.5" fill="none" stroke="currentColor" stroke-width="9"/>
    <path d="M60 9 L88 18 L63 34 Z" fill="currentColor"/><circle cx="51" cy="43" r="6.5" fill="var(--red)"/></g></svg>
  <h1 id="title" aria-live="polite">Loading…</h1>
  <p id="sub"></p>
  <p id="note"></p>
  <footer>Shared from <a href="about.html">Vetta</a>. Only the arrival time is shared: not where they are, their route or where they're going.</footer>
</main>
<script src="eta_share.js"></script>
<script>
  (() => {
    const t = new URLSearchParams(location.search).get('t') || '';
    const paint = (v) => {
      const x = ApexEtaShare.viewText(v), h = document.getElementById('title');
      // the minutes set large; the three parts read as the title, word for word (eta_share.js)
      if (x.parts) {
        const part = (cls, text) => { const e = document.createElement(cls === 'num' ? 'b' : 'span'); e.className = cls; e.textContent = text; return e; };
        h.replaceChildren(part('lead', x.parts[0]), ' ', part('num', x.parts[1]), ' ', part('unit', x.parts[2]));
      } else h.textContent = x.title;
      for (const k of ['sub', 'note']) document.getElementById(k).textContent = x[k];
      document.querySelector('main').dataset.state = x.live ? 'live' : x.note ? 'stale' : 'end';
      return v;
    };
    let last = null;
    async function load() {
      try {
        const r = await fetch(`/api/eta/${encodeURIComponent(t)}`, { headers: { 'x-apexnav': '1' }, cache: 'no-store' });
        last = r.ok ? await r.json() : (r.status === 404 ? null : last);
      } catch (_) { /* offline: keep what we have */ }
      paint(last);
      if (!last || !last.ended) setTimeout(load, 30000);
    }
    setInterval(() => last && !last.ended && paint(last), 15000);   // the minutes count down between polls
    load();
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' apexnav:; script-src 'self' apexnav: 'sha256-+gLf8rCruiLu/UstFFeBMrf1CuocrPM66/SGIZZkm24=' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self' apexnav: blob:; child-src 'self' apexnav: blob:; style-src 'self' apexnav: 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' apexnav: data: https://fonts.gstatic.com; img-src 'self' apexnav: data: blob: https://tiles.openfreemap.org https://s3.amazonaws.com; media-src 'self' apexnav: data: blob:; connect-src 'self' apexnav: data: blob: https://apexnav.senftns.workers.dev https://tiles.openfreemap.org https://s3.amazonaws.com https://valhalla1.openstreetmap.de https://router.project-osrm.org https://overpass-api.de https://overpass.private.coffee https://overpass.kumi.systems https://nominatim.openstreetmap.org https://photon.komoot.io https://api.open-meteo.com https://vpic.nhtsa.dot.gov https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://*.hf.co; object-src 'none'; base-uri 'none'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Vetta · Arrival time</title>
  <link rel="icon" href="brand/mark.svg" type="image/svg+xml" />
  <style>
    :root { --paper: #ece3d3; --ink: #1b1914; --dim: #5f594d; --red: #c8102e; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.45 system-ui, -apple-system, sans-serif; }
    main { max-width: 520px; margin: 0 auto; padding: calc(56px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-right, 0px)) calc(56px + env(safe-area-inset-bottom, 0px)) calc(20px + env(safe-area-inset-left, 0px)); }
    /* the status bar's band: text scrolling up passes under it, never visibly behind the Dynamic Island or notch */
    body::before { content: ""; position: fixed; z-index: 100; left: 0; right: 0; top: 0; height: env(safe-area-inset-top, 0px); background: var(--paper); }
    h1 { font-size: 34px; line-height: 1.15; margin: 0 0 10px; }
    #sub { font-size: 22px; margin: 0 0 18px; }
    #note, footer { color: var(--dim); font-size: 15px; }
    footer { margin-top: 48px; }
    footer a { color: var(--ink); }
    .mark { width: 40px; height: 40px; margin-bottom: 28px; }
  </style>
</head>
<body>
<main>
  <img class="mark" src="brand/mark.svg" alt="Vetta" />
  <h1 id="title" aria-live="polite">Loading…</h1>
  <p id="sub"></p>
  <p id="note"></p>
  <footer>Shared from <a href="about.html">Vetta</a>. Only the arrival time is shared: not where they are, their route or where they're going.</footer>
</main>
<script src="eta_share.js"></script>
<script>
  (() => {
    const t = new URLSearchParams(location.search).get('t') || '';
    const paint = (v) => { const x = ApexEtaShare.viewText(v); for (const k of ['title', 'sub', 'note']) document.getElementById(k).textContent = x[k]; return v; };
    let last = null;
    async function load() {
      try {
        const r = await fetch(`/api/eta/${encodeURIComponent(t)}`, { headers: { 'x-apexnav': '1' }, cache: 'no-store' });
        last = r.ok ? await r.json() : (r.status === 404 ? null : last);
      } catch (_) { /* offline: keep what we have */ }
      paint(last);
      if (!last || !last.ended) setTimeout(load, 30000);
    }
    setInterval(() => last && !last.ended && paint(last), 15000);   // the minutes count down between polls
    load();
  })();
</script>
</body>
</html>

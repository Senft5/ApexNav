<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' apexnav:; script-src 'self' apexnav: https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self' apexnav: blob:; child-src 'self' apexnav: blob:; style-src 'self' apexnav: 'unsafe-inline'; font-src 'self' apexnav: data:; img-src 'self' apexnav: data: blob: https://tiles.openfreemap.org https://s3.amazonaws.com https://basemap.nationalmap.gov https://itscameras.dot.state.oh.us https://www.trimarc.org https://*.fbcdn.net; media-src 'self' apexnav: data: blob:; connect-src 'self' apexnav: data: blob: https://vettadrive.app wss://vettadrive.app https://tiles.openfreemap.org https://basemap.nationalmap.gov https://s3.amazonaws.com https://valhalla1.openstreetmap.de https://router.project-osrm.org https://overpass-api.de https://overpass.private.coffee https://overpass.kumi.systems https://maps.mail.ru https://nominatim.openstreetmap.org https://photon.komoot.io https://api.open-meteo.com https://api.weather.gov https://statsapi.mlb.com https://api.seatgeek.com https://api.water.noaa.gov https://waterservices.usgs.gov https://in.carsprogram.org https://publicapi.ohgo.com https://quickstats.nass.usda.gov https://commons.wikimedia.org https://graph.mapillary.com https://vpic.nhtsa.dot.gov https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://*.hf.co; object-src 'none'; base-uri 'none'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0B" />
  <title>Vetta Sounds</title>
  <meta name="description" content="An endless ear-training loop: a metronome, random scales, modes and arpeggios over a drone, the solfège as it plays, and a vocal range test." />
  <link rel="icon" href="brand/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <script src="practice_viz.js" defer></script>
  <script src="practice_loop.js" defer></script>
  <script src="sounds.js" defer></script>
  <script src="sounds_boot.js" defer></script>
  <style>
    /* sounds.vettadrive.app (backend/src/hosts.ts SOUNDS_HOST): the Practice Loop for anyone, in the browser (web/sounds.js). */
    :root { --panel: #111214; --panel-ink: #F5F5F7; --panel-dim: #A0A3AB; --rule: #2B2D33; --accent: #FF3341; --raised: #1B1C20; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #0A0A0B; color: var(--panel-ink); font: 15px/1.45 "Inter Tight", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased; }
    main { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 40px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    header img { width: 30px; height: 30px; border-radius: 8px; }
    h1 { margin: 0; font: 800 24px/1 "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; letter-spacing: 0.02em; text-transform: uppercase; }
    h1 span { color: var(--accent); }
    #sheet { display: flex; flex-direction: column; gap: 8px; }
    .pl-now { margin: 0; font-size: 18px; font-weight: 650; min-height: 26px; }
    .pl-range { margin: 0; color: var(--panel-dim); }
    .pl-viz-box { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row > span { color: var(--panel-dim); }
    .mt-8 { margin-top: 8px; }
    .note { margin: 0; color: var(--panel-dim); font-size: 13px; }
    .group-label { margin-top: 10px; text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px; font-weight: 650; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .ink-btn { min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--rule); background: var(--raised); font-weight: 600; }
    .ink-btn.solid { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 96px; }
    .ink-btn:disabled { opacity: 0.45; cursor: default; }
    .ink-btn[hidden] { display: none; }
    .detents { display: flex; flex-wrap: wrap; gap: 6px; }
    .detents > button { flex: 1 1 0; min-width: 48px; min-height: 44px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--rule);
      background: var(--raised); font-weight: 600; }
    .detents > [aria-pressed="true"] { background: var(--panel-ink); color: var(--panel); }
    .field { min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--rule); background: var(--raised); color: inherit; font: inherit; }
    .row .field { flex: 1; }
    .sw { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px 0 6px; border-radius: 22px; border: 1px solid var(--rule); background: var(--raised); }
    .sw i { width: 36px; height: 22px; border-radius: 11px; background: var(--rule); position: relative; }
    .sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel-dim); transition: left 0.15s; }
    .sw.on i { background: var(--accent); }
    .sw.on i::after { left: 17px; background: #fff; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <header><img src="brand/mark.svg" alt="" /><h1>Vetta <span>Sounds</span></h1></header>
    <div id="sheet"></div>
  </main>
</body>
</html>

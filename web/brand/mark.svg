<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Vetta">
  <!-- Vetta mark: a road-book tulip for a right-hand corner. Dot = where you are,
       line = the road, arrow = the exit, red dot = the apex on the inside of the bend.
       Ink uses currentColor; the apex uses the CSS variable brand-accent, then the app accent. -->
  <style>.apex{fill:var(--brand-accent,var(--accent,#C8102E))}</style>
  <g transform="translate(-7 0)">
  <circle cx="34" cy="84" r="8" fill="currentColor"/>
  <path d="M34 84 V52 Q34 26 62 21.5" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="butt"/>
  <path d="M60 9 L88 18 L63 34 Z" fill="currentColor"/>
  <circle class="apex" cx="51" cy="43" r="6.5"/>
  </g>
</svg>

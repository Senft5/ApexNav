<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 100" width="372" height="100" role="img" aria-label="Vetta">
  <!-- Vetta wordmark: tulip mark + VETTA in monoline caps drawn as paths (no font file). Vetta is Italian for a summit,
       the top of the pass. Ink uses currentColor; the apex dot uses the CSS variable brand-accent, then the app accent. -->
  <style>.apex{fill:var(--brand-accent,var(--accent,#C8102E))}</style>
  <defs><clipPath id="cap"><rect x="0" y="26" width="372" height="48"/></clipPath></defs>
  <circle cx="34" cy="84" r="8" fill="currentColor"/>
  <path d="M34 84 V52 Q34 26 62 21.5" fill="none" stroke="currentColor" stroke-width="9"/>
  <path d="M60 9 L88 18 L63 34 Z" fill="currentColor"/>
  <circle class="apex" cx="51" cy="43" r="6.5"/>
  <g clip-path="url(#cap)" fill="none" stroke="currentColor" stroke-linejoin="miter" stroke-miterlimit="10" stroke-width="8.5">
    <path d="M118 22 L135 78 L152 22"/>
    <path d="M196 30 H170.25 V70 H196 M170.25 50 H190"/>
    <path d="M208 30 H244 M226 30 V80"/>
    <path d="M254 30 H290 M272 30 V80"/>
    <path d="M300 78 L317 22 L334 78 M306 59 H328"/>
  </g>
</svg>
